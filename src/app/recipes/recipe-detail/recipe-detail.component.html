
<div class="row">
    <div class="col-12">
        <img [src]="recipe.imagePath" alt="{{recipe.name}}" class="img-fluid"
        style="max-height: 100px;">
    </div>
</div> 
<div class="row">
    <div class="col-12">
        <h1>{{ recipe.name }}</h1>
    </div>
</div>
<div class="row">
    <div class="col-12">
        <div class="btn-group" appDropdown #menu="appDropdown">
            <button type="button" class="btn btn-primary dropdown-toggle" [attr.aria-expanded]="menu.isOpen">
                Manage Recipe
            </button>
            <ul class="dropdown-menu">
                <li><button type="button" class="dropdown-item" (click)="onAddToShoppingList()">Add Ingredients to Shopping List</button></li>
                <li><a class="dropdown-item" href="#">Edit Recipe</a></li>
                <li><a class="dropdown-item" href="#">Delete Recipe</a></li>
            </ul>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-12">
        {{recipe.description}}
    </div>
</div>
<div class="row">
    <div class="col-12">
        <ul class="list-group">
            @for (ingredient of recipe.ingredients; track ingredient) {
                <li class="list-group-item">{{ ingredient.name }} - {{ ingredient.amount }}</li>
            }
        </ul>
    </div>
</div>
